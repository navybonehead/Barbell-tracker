<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Barbell Tracker</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f3f4f6;margin:0;color:#111827}header{background:#111827;color:white;padding:18px 16px}h1{margin:0;font-size:24px}.sub{opacity:.7;font-size:13px;margin-top:3px}
nav{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:white;padding:10px;position:sticky;top:0}nav button,.btn{border:0;border-radius:8px;padding:10px;font-weight:700}nav button{background:#e5e7eb}nav .active,.primary{background:#111827;color:white}
main{max-width:720px;margin:auto;padding:12px}.day{font-size:21px;font-weight:800;margin:5px 2px 12px}.card{background:white;border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px #0001}.tag{font-size:11px;color:#6b7280;text-transform:uppercase}.card h2{font-size:17px;margin:3px 0}.last{font-size:13px;color:#4b5563;margin:8px 0}.inputs{display:grid;grid-template-columns:1fr 1fr;gap:8px}.inputs label{font-size:12px;color:#6b7280}.inputs input,.reps{width:100%;padding:9px;border:1px solid #d1d5db;border-radius:7px;font-size:16px;box-sizing:border-box}.set{display:grid;grid-template-columns:32px 1fr 35px;gap:7px;align-items:center;margin:6px 0}.set span{text-align:center;color:#6b7280;font-weight:700}.actions{display:flex;gap:8px;margin-top:10px}.secondary{background:#e5e7eb}.footer{max-width:720px;margin:auto;padding:8px 12px 30px}.note{text-align:center;color:#6b7280;font-size:12px}
</style></head><body><header><h1>Barbell Tracker</h1><div class="sub">Strength + hypertrophy · local log</div></header><nav id="nav"></nav><main id="app"></main><div class="footer"><button class="btn secondary" onclick="exportData()">Export Backup</button> <button class="btn secondary" onclick="document.getElementById('file').click()">Import Backup</button><input id="file" type="file" accept=".json" hidden onchange="importData(event)"><p class="note">Data stays on this device/browser. Export backups periodically.</p></div>
<script>
const P={Monday:[["Squat","Intensity","sqI"],["Bench Press","Volume","bpV"],["Rope Crunch","Ladder","cr"],["Roman Chair Leg Raise","Ladder","lr"]],Tuesday:[["Deadlift","Intensity","dlI"],["OHP","Volume","ohpV"],["Chins","Ladder","ch"]],Thursday:[["Squat","Volume","sqV"],["Bench Press","Intensity","bpI"],["Barbell Row","Volume","rowV"],["Rope Crunch","Ladder","cr"],["Roman Chair Leg Raise","Ladder","lr"]],Friday:[["RDL","Volume","rdlV"],["OHP","Intensity","ohpI"],["Chins","Ladder","ch"]]};
let D=JSON.parse(localStorage.getItem("BT")||"{}"),day="Monday";
const save=()=>localStorage.setItem("BT",JSON.stringify(D));
function last(id){let h=D[id]?.h||[];return h[h.length-1]}
function suggestion(id,type){let x=last(id);if(!x)return "";let r=x.s.map(v=>+v||0);if(type=="Ladder"){if(r.every(v=>v>=15))return (r.length+1)+"×8";return r.length+"×"+Math.min(15,Math.min(...r)+1)}if(type=="Volume"&&r.length&&r.every(v=>v>=8))return ((+x.w||0)+5)+" lb";if(type=="Intensity"&&x.w)return ((+x.w||0)+5)+" lb if clean";return ""}
function card(a){
 let [name,type,id]=a,x=last(id),sets=x?x.s:[""], sug=suggestion(id,type);
 let q='<section class="card" data-id="'+id+'" data-type="'+type+'"><div class="tag">'+type+'</div><h2>'+name+'</h2><div class="last"><b>Last:</b> '+(x?((x.w?x.w+" lb · ":"")+x.s.join(", ")):"No history")+ (sug?"<br><b>Suggested:</b> "+sug:"")+"</div>";
 if(type!="Ladder")q+='<div class="inputs"><label>Weight (lb)<input class="weight" inputmode="decimal" value="'+(x?.w||"")+'"></label><label>Sets<input class="nsets" type="number" min="1" value="'+sets.length+'"></label></div>';
 q+='<div class="sets">'+sets.map((v,i)=>'<div class="set"><span>'+(i+1)+'</span><input class="reps" inputmode="numeric" placeholder="reps" value="'+v+'"><button class="btn secondary" onclick="rm(this)">−</button></div>').join("")+'</div><div class="actions"><button class="btn primary" onclick="saveCard(this)">Save</button><button class="btn secondary" onclick="add(this)">+ Set</button></div></section>';return q}
function render(){document.getElementById("nav").innerHTML=["Monday","Tuesday","Thursday","Friday"].map(d=>'<button class="'+(d==day?"active":"")+'" data-day="'+d+'" onclick="selectDay(this.dataset.day)">'+d.slice(0,3)+'</button>').join("");document.getElementById("app").innerHTML='<div class="day">'+day+'</div>'+P[day].map(card).join("")}
function selectDay(d){day=d;render()}
function add(b){let c=b.closest(".card"),box=c.querySelector(".sets"),n=box.children.length+1;let e=document.createElement("div");e.className="set";e.innerHTML='<span>'+n+'</span><input class="reps" inputmode="numeric" placeholder="reps"><button class="btn secondary" onclick="rm(this)">−</button>';box.appendChild(e)}
function rm(b){let box=b.closest(".sets");if(box.children.length>1)b.parentElement.remove();[...box.children].forEach((e,i)=>e.children[0].textContent=i+1)}
function saveCard(b){let c=b.closest(".card"),id=c.dataset.id,w=c.querySelector(".weight")?.value||"",s=[...c.querySelectorAll(".reps")].map(x=>x.value).filter(Boolean);if(!s.length)return alert("Enter at least one set.");D[id]??={h:[]};D[id].h.push({date:new Date().toISOString(),w,s});save();render()}
function exportData(){let b=new Blob([JSON.stringify(D,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="barbell-tracker-backup.json";a.click()}
function importData(e){let f=e.target.files[0],r=new FileReader();r.onload=()=>{try{D=JSON.parse(r.result);save();render();alert("Backup imported.")}catch{alert("Invalid backup.")}};r.readAsText(f)}
render();
</script></body></html>
